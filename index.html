<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Animated Stamp Collection — LINEスタンプ一覧">
  <title>Animated Stamp Collection</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b3df5'/%3E%3Cpath d='M17 22h30v20H30l-9 7v-7h-4z' fill='white'/%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');
    :root{--ink:#11111b;--paper:#f8f7ff;--violet:#5b3df5;--pink:#ff4b97;--lime:#c7f34a;--line:#dedcf3}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif}
    header{background:var(--ink);color:white;padding:18px clamp(20px,5vw,76px);display:flex;justify-content:space-between;align-items:center;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.02em}.brand b{width:28px;height:28px;background:var(--lime);color:var(--ink);border-radius:9px;display:grid;place-items:center;font:500 15px 'DM Mono'}
    .count{font:500 12px 'DM Mono';color:#c7c6d6;white-space:nowrap}.hero{background:var(--violet);color:#fff;min-height:360px;padding:clamp(32px,6vw,78px);position:relative;overflow:hidden;display:grid;grid-template-columns:1fr minmax(180px,360px);align-items:center;gap:30px}
    .hero:before{content:'STAMPS';position:absolute;font:900 clamp(100px,22vw,310px)/.7 sans-serif;right:-15px;bottom:-27px;opacity:.08}.eyebrow{font:500 12px 'DM Mono';letter-spacing:.12em;color:var(--lime)}h1{font-size:clamp(38px,6vw,78px);line-height:1.05;margin:14px 0 15px;letter-spacing:-.05em}.hero p{font-size:16px;max-width:400px;margin:0;line-height:1.8;color:#e5e2ff}.hero-image{position:relative;z-index:1;width:min(100%,310px);justify-self:center;filter:drop-shadow(18px 22px 0 rgba(17,17,27,.2))}.protected-media{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none}
    main{max-width:1440px;margin:auto;padding:44px clamp(20px,5vw,76px) 80px}.section-line{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;gap:10px}.section-line h2{margin:0;font-size:24px;letter-spacing:-.04em}.section-line span{font:500 12px 'DM Mono';color:#6d6b80}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0;transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-5px);box-shadow:0 14px 26px #29215620}.art{height:185px;display:grid;place-items:center;background:linear-gradient(135deg,#f1f0ff,#fff);padding:12px}.art img{height:100%;width:100%;object-fit:contain}.caption{border-top:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}.caption strong{font-size:14px}.caption small{font:500 10px 'DM Mono';color:#777489}.badge{width:8px;height:8px;background:var(--pink);border-radius:50%;flex:none}
    footer{padding:22px clamp(20px,5vw,76px);background:var(--ink);color:#b6b4c4;font:400 11px 'DM Mono';display:flex;justify-content:space-between;gap:15px}@media(max-width:600px){.hero{grid-template-columns:1fr;min-height:0}.hero-image{width:180px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:150px}.caption{padding:10px}.caption strong{font-size:12px}footer{flex-direction:column}}
  </style>
</head>
<body>
  <header><div class="brand"><b>✦</b> ANIMATED STAMP COLLECTION</div><div class="count">24 CHARACTERS / 01 SERIES</div></header>
  <section class="hero"><div><div class="eyebrow">LINE STAMP ARCHIVE</div><h1>動く！SINCE YOU...<br>-本店-1</h1><p>メイン画像、タブ画像、スタンプ画像をまとめたコレクション。好きなキャラクターを選んで、表情豊かな一枚を見つけよう。</p></div><img class="hero-image protected-media" draggable="false" src="stamps/goto_seiki_line_animated_stamp.gif" alt="後藤　聖輝のメインスタンプ画像"></section>
  <main>
    <div class="section-line"><h2>スタンプコレクション</h2><span id="shown">SHOWING 24 / 24</span></div><section class="grid" id="grid" aria-label="スタンプ一覧"></section>
  </main>
  <footer><span>ANIMATED STAMP COLLECTION</span><span>SELECT A CHARACTER, SHARE A FEELING.</span></footer>
  <script>
  const stamps=[
    ['後藤　聖輝','goto_seiki_line_animated_stamp.png'],['雪也','yukiya_line_animated_stamp.png'],['リクメロ','rikumero_line_animated_stamp.png'],['椿　鳴','tsubaki_naru_line_animated_stamp.png'],['セリ','seri_line_animated_stamp.png'],['ユノ','yuno_line_animated_stamp.png'],['神崎　リセ','kanzaki_rise_line_animated_stamp.png'],['カヲル','kaworu_line_animated_stamp.png'],['堂本　曖','domoto_ai_line_animated_stamp.png'],['RYO','ryo_line_animated_stamp.png'],['綾翔','ayato_line_animated_stamp.png'],['酒・GO','sake_go_line_animated_stamp.png'],['真白　麗央','mashiro_reo_line_animated_stamp.png'],['御堂　拓哉','midou_takuya_line_animated_stamp.png'],['ちひろ','chihiro_line_animated_stamp.png'],['れの','reno_line_animated_stamp.png'],['海生','kaisei_line_animated_stamp.png'],['牧野　つくし','makino_tsukushi_line_animated_stamp.png'],['皇太','kota_line_animated_stamp.png'],['龍馬','ryoma_line_animated_stamp.png'],['天内　悠','tenuchi_yu_line_animated_stamp.png'],['れんと','rento_line_animated_stamp.png'],['あさひ','asahi_line_animated_stamp.png'],['心　なつき','kokoro_natsuki_line_animated_stamp.png']
  ];
  const grid=document.querySelector('#grid');
  grid.innerHTML=stamps.map(([name,file],i)=>`<article class="card"><div class="art"><img class="protected-media" draggable="false" loading="lazy" src="stamps/${file.replace('.png','.gif')}" alt="${name}のLINEスタンプ"></div><div class="caption"><strong>${name}</strong><span class="badge" aria-label="アニメーションスタンプ"></span><small>${String(i+1).padStart(2,'0')}</small></div></article>`).join('');
  document.addEventListener('contextmenu',event=>{if(event.target.closest('.protected-media'))event.preventDefault()});
  document.addEventListener('dragstart',event=>{if(event.target.closest('.protected-media'))event.preventDefault()});
  </script>
</body>
</html>
